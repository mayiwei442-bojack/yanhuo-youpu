<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#173f36">
  <meta name="description" content="烟火有谱：根据食材找菜谱，也可以根据菜谱生成食材与采购清单。">
  <title>烟火有谱｜今天吃什么，家里有什么</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%23c64a2d'/%3E%3Cpath d='M17 21h30M21 31h22M25 41h14' stroke='%23fffaf0' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="src/styles/app.css">
  <link rel="stylesheet" href="src/styles/assistant.css">
  <script src="data/recipes.js" defer></script>
  <script src="data/ingredients.js" defer></script>
  <script src="data/features.js" defer></script>
  <script src="src/js/future-services.js" defer></script>
  <script src="src/js/howtocook-renderer.js" defer></script>
  <script src="src/js/app.js" defer></script>
  <script src="src/js/assistant.js" defer></script>
</head>
<body>
  <div class="paper-grain" aria-hidden="true"></div>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="#/home" aria-label="烟火有谱首页">
        <span class="brand-seal">谱</span>
        <span>
          <strong>烟火有谱</strong>
          <small>YAN HUO · RECIPE</small>
        </span>
      </a>
      <div class="topbar-actions">
        <button class="icon-button basket-button" type="button" data-nav="#/shopping" aria-label="打开采购清单">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9h14l-1.2 10H6.2L5 9Zm3-3 4-3 4 3M9 12v4m6-4v4"/></svg>
          <span class="count-badge" id="shopping-count">0</span>
        </button>
      </div>
    </header>

    <main id="app-view" tabindex="-1" aria-live="polite"></main>

    <nav class="bottom-nav" id="bottom-nav" aria-label="主要导航">
      <button type="button" data-nav="#/home" data-tab="home">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 11 9-8 9 8v9h-6v-6H9v6H3v-9Z"/></svg>
        <span>首页</span>
      </button>
      <button type="button" data-nav="#/recipes" data-tab="recipes">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h12a2 2 0 0 1 2 2v14H7a2 2 0 0 1-2-2V4Zm2 0v14a2 2 0 0 0 2 2M10 8h6m-6 4h6"/></svg>
        <span>菜谱</span>
      </button>
      <button type="button" data-nav="#/pantry" data-tab="pantry">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h16v12H4V8Zm2-4h12v4H6V4Zm3 8h6m-3-3v6"/></svg>
        <span>食材篮</span>
      </button>
      <button type="button" data-nav="#/me" data-tab="me">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm-7 8c.8-4 3.1-6 7-6s6.2 2 7 6H5Z"/></svg>
        <span>我的</span>
      </button>
    </nav>
  </div>

  <dialog class="sheet" id="action-sheet" aria-labelledby="sheet-title">
    <div class="sheet-handle" aria-hidden="true"></div>
    <div id="sheet-content"></div>
    <button class="sheet-close" type="button" data-action="close-sheet" aria-label="关闭弹层">×</button>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <button class="assistant-launcher" id="assistant-launcher" type="button" aria-label="打开菜谱 AI 助手" aria-expanded="false" aria-controls="assistant-panel" title="问问菜谱助手">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 9V7a5 5 0 0 1 10 0v2M6 9h12a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-3l-3 3-3-3H6a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2Z"/><path d="M9 13h.01M15 13h.01M10 16h4"/></svg>
  </button>
  <section class="assistant-panel" id="assistant-panel" role="dialog" aria-modal="false" aria-labelledby="assistant-title" hidden>
    <header class="assistant-header">
      <div><span class="assistant-eyebrow">烟火有谱 · AI</span><h2 id="assistant-title">菜谱助手</h2></div>
      <button class="assistant-close" id="assistant-close" type="button" aria-label="收起菜谱助手">×</button>
    </header>
    <div class="assistant-messages" id="assistant-messages" role="log" aria-label="与菜谱助手的对话" aria-live="polite" aria-relevant="additions text">
      <div class="assistant-welcome" id="assistant-welcome">
        <span class="assistant-welcome-mark" aria-hidden="true">谱</span>
        <h3>今天想做点什么？</h3>
        <p>告诉我菜名，或手头的食材。<br>我会从菜谱知识库里帮你找。</p>
        <div class="assistant-prompts">
          <button type="button">鸡蛋和番茄能做什么？</button>
          <button type="button">宫保鸡丁需要哪些原料？</button>
          <button type="button">找几道简单的素菜</button>
        </div>
      </div>
    </div>
    <form class="assistant-form" id="assistant-form">
      <label class="assistant-sr-only" for="assistant-input">输入菜名、原料或你的问题</label>
      <div class="assistant-input-row">
        <textarea id="assistant-input" rows="2" maxlength="1000" placeholder="问菜谱、查原料……" enterkeyhint="send" required></textarea>
        <button class="assistant-send" id="assistant-send" type="submit" aria-label="发送问题" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5m-6 6 6-6 6 6"/></svg></button>
      </div>
      <p class="assistant-footnote">回答依据菜谱知识库，资料不足时会告诉你。</p>
    </form>
  </section>

  <noscript>
    <div class="noscript">请开启 JavaScript 以体验食材匹配、采购清单和图文烹饪功能。</div>
  </noscript>
</body>
</html>
